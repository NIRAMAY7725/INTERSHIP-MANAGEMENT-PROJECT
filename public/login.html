<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — InternManage</title>
    <meta name="description" content="Sign in to your InternManage account to manage internships, applications, and more." />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

    <!-- ═══ NAVBAR ═══ -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <div class="navbar-logo">🎓</div>
                <div class="navbar-brand-text">
                    <h1>Intern<span>Manage</span></h1>
                    <p>Empowering Internships, Building Careers</p>
                </div>
            </a>
            <div class="navbar-nav" id="navMenu">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="features.html">Features</a>
                <a href="how-it-works.html">How It Works</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="navbar-actions">
                <div class="navbar-auth">
                    <a href="login.html" class="btn btn-outline btn-sm">Login</a>
                    <a href="register.html" class="btn btn-primary btn-sm">Register</a>
                </div>
                <div class="navbar-user" id="navUser">
                    <div class="navbar-user-avatar">N</div>
                    <span class="navbar-user-name">User</span>
                    <a href="login.html" id="logoutBtn" class="btn btn-outline btn-sm">Logout</a>
                </div>
                <button class="navbar-toggle" id="navToggle" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ═══ LOGIN FORM ═══ -->
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🎓</div>
                <h2>Welcome Back!</h2>
                <p>Sign in to your InternManage account</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <div class="form-input-icon">
                        <span class="input-icon">✉️</span>
                        <input type="email" class="form-input" id="loginEmail" placeholder="Enter your email" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div class="form-input-icon">
                        <span class="input-icon">🔒</span>
                        <div class="password-wrapper" style="width: 100%;">
                            <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required minlength="6" style="padding-left: 44px; padding-right: 44px;" />
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--gray-500); cursor: pointer;">
                        <input type="checkbox" style="accent-color: var(--primary);" />
                        Remember me
                    </label>
                    <a href="#" style="font-size: 0.85rem; color: var(--primary); font-weight: 500;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">
                    Sign In →
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
