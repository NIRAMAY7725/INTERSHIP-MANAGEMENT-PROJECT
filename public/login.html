<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — InternManage</title>
    <meta name="description" content="Sign in to your InternManage account to manage internships, applications, and more." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/mobile.css" />
</head>
<body>

    <!-- ═══ NAVBAR ═══ -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <div class="navbar-logo">🎓</div>
                <div class="navbar-brand-text">
                    <h1>Intern<span>Manage</span></h1>
                    <p>Empowering Internships, Building Careers</p>
                </div>
            </a>
            <div class="navbar-nav" id="navMenu">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/features">Features</a>
                <a href="/how-it-works">How It Works</a>
                <a href="/contact">Contact</a>
            </div>
            <div class="navbar-actions">
                <div class="navbar-auth">
                    <a href="/login" class="btn btn-outline btn-sm">Login</a>
                    <a href="/register" class="btn btn-primary btn-sm">Register</a>
                </div>
                <div class="navbar-user" id="navUser">
                    <div class="navbar-user-avatar">N</div>
                    <span class="navbar-user-name">User</span>
                    <a href="/login" id="logoutBtn" class="btn btn-outline btn-sm">Logout</a>
                </div>
                <button class="navbar-toggle" id="navToggle" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ═══ LOGIN FORM ═══ -->
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🎓</div>
                <h2>Welcome Back!</h2>
                <p>Sign in to your InternManage account</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <div class="form-input-icon">
                        <span class="input-icon">✉️</span>
                        <input type="email" class="form-input" id="loginEmail" placeholder="Enter your email" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div class="form-input-icon">
                        <span class="input-icon">🔒</span>
                        <div class="password-wrapper wide">
                            <input type="password" class="form-input password-input" id="loginPassword" placeholder="Enter your password" required minlength="6" />
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>
                </div>

                <div class="auth-check-row">
                    <label class="auth-check-label">
                        <input type="checkbox" />
                        Remember me
                    </label>
                    <a href="/" class="auth-link-inline">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">
                    Sign In →
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
