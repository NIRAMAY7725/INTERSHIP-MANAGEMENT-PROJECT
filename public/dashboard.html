<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InternManage | Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/dashboard.js" defer></script>
</head>
<body>
    <aside>
        <a class="brand" href="/">Intern<span>Manage</span></a>
        <p id="role"></p>
        <nav id="nav" aria-label="Dashboard"></nav>
    </aside>
    <main>
        <header>
            <button type="button" id="menu" aria-controls="nav" aria-expanded="true">Menu</button>
            <div class="account">
                <button type="button" id="identity" aria-controls="account" aria-expanded="false">Account</button>
                <div id="account" hidden>
                    <button type="button" id="profile">My profile</button>
                    <button type="button" id="password">Change password</button>
                    <button type="button" id="logout">Sign out</button>
                </div>
            </div>
        </header>
        <h1 id="heading" tabindex="-1">Dashboard</h1>
        <p id="notice" role="status" aria-live="polite">Loading account…</p>
        <section id="content" aria-labelledby="heading"></section>
    </main>
</body>
</html>
