<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading... — InternManage</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="dashboard-loading-page">
    <div id="loading-screen" class="dashboard-loading-screen" aria-live="polite" aria-label="Loading screen">
        <div class="dashboard-loader-content">
            <div class="dashboard-brand-badge">InternManage</div>
            <h1 class="dashboard-loader-title">Loading your workspace</h1>
            <p class="dashboard-loader-subtitle">Preparing your dashboard experience...</p>
            <div class="dashboard-progress-bar" aria-hidden="true">
                <div class="dashboard-progress-fill"></div>
            </div>
        </div>
    </div>
</body>
</html>
