<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — InternManage</title>
    <meta name="description" content="Create your InternManage account — join as a student, company, or administrator." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/mobile.css" />
</head>
<body>

    <!-- ═══ NAVBAR ═══ -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <div class="navbar-logo">🎓</div>
                <div class="navbar-brand-text">
                    <h1>Intern<span>Manage</span></h1>
                    <p>Empowering Internships, Building Careers</p>
                </div>
            </a>
            <div class="navbar-nav" id="navMenu">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/features">Features</a>
                <a href="/how-it-works">How It Works</a>
                <a href="/contact">Contact</a>
            </div>
            <div class="navbar-actions">
                <div class="navbar-auth">
                    <a href="/login" class="btn btn-outline btn-sm">Login</a>
                    <a href="/register" class="btn btn-primary btn-sm">Register</a>
                </div>
                <div class="navbar-user" id="navUser">
                    <div class="navbar-user-avatar">N</div>
                    <span class="navbar-user-name">User</span>
                    <a href="/login" id="logoutBtn" class="btn btn-outline btn-sm">Logout</a>
                </div>
                <button class="navbar-toggle" id="navToggle" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ═══ REGISTER FORM ═══ -->
    <div class="auth-page">
        <div class="auth-card auth-card-lg">
            <div class="auth-header">
                <div class="auth-logo">🎓</div>
                <h2>Create Account</h2>
                <p>Join InternManage and start your journey</p>
            </div>

            <form id="registerForm" class="auth-form">
                <!-- Role Selector -->
                <div class="auth-card-form-group">
                    <label class="form-label">I am a...</label>
                    <div class="role-selector">
                        <div class="role-option selected" data-role="user">
                            <div class="role-option-icon">👨‍🎓</div>
                            <div class="role-option-label">Student</div>
                        </div>
                        <div class="role-option" data-role="company">
                            <div class="role-option-icon">🏢</div>
                            <div class="role-option-label">Company</div>
                        </div>
                        <div class="role-option" data-role="admin">
                            <div class="role-option-icon">🛡️</div>
                            <div class="role-option-label">Admin</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerName">Full Name</label>
                    <div class="form-input-icon">
                        <span class="input-icon">👤</span>
                        <input type="text" class="form-input" id="registerName" placeholder="Enter your full name" required minlength="2" maxlength="50" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerEmail">Email Address</label>
                    <div class="form-input-icon">
                        <span class="input-icon">✉️</span>
                        <input type="email" class="form-input" id="registerEmail" placeholder="Enter your email" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerPassword">Password</label>
                    <div class="form-input-icon">
                        <span class="input-icon">🔒</span>
                        <div class="password-wrapper wide">
                            <input type="password" class="form-input password-input" id="registerPassword" placeholder="Create a password (min 6 chars)" required minlength="6" />
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerConfirmPassword">Confirm Password</label>
                    <div class="form-input-icon">
                        <span class="input-icon">🔒</span>
                        <div class="password-wrapper wide">
                            <input type="password" class="form-input password-input" id="registerConfirmPassword" placeholder="Confirm your password" required minlength="6" />
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>
                </div>

                <div class="auth-card-form-group auth-card-form-min">
                    <label class="auth-terms">
                        <input type="checkbox" required />
                        I agree to the <a href="/terms">Terms of Service</a>&nbsp;and&nbsp;<a href="/privacy">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">
                    Create Account →
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Sign In</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
